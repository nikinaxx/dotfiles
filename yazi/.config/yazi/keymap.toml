[[mgr.prepend_keymap]]
on   = [ "g", "c" ]
run  = "shell 'code .' --orphan"
desc = "Open current folder in VS Code"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter folder or open file"

[[mgr.prepend_keymap]]
on   = "<C-e>"
run  = "seek 5"
desc = "Scroll preview down"

[[mgr.prepend_keymap]]
on   = "<C-y>"
run  = "seek -5"
desc = "Scroll preview up"

[[mgr.prepend_keymap]]
on   = "t"
run  = 'shell -- tmux new-window -c "$PWD"'
desc = "New tmux window in current dir"

[[mgr.prepend_keymap]]
on   = "e"
run  = 'shell -- tmux new-window -n "claude:$(basename "$PWD")" -c "$PWD" claude'
desc = "Claude in current dir"
