[mgr]
show_hidden = true
sort_by = "natural"
sort_dir_first = true

[opener]
brave = [
    { run = 'brave-browser --new-window "$@"', orphan = true, desc = "Brave" },
]

# -r reuses the last focused VS Code window instead of opening a new one
vscode = [
    { run = 'code -r "$@"', orphan = true, desc = "VS Code" },
]

extract = [
	{ run = "ya pub extract --list %s", desc = "Extract here" },
]
extract2 = [
    { run = 'for f in "$@"; do 7z x -y -bd -o"${f%.*}" "$f" < /dev/null; done', desc = "Extract to folder", for = "unix" },
]

[open]
prepend_rules = [
    { url = "*.zip", use = "extract2" },
    { mime = "application/pdf", use = "brave" },
    { mime = "text/*", use = [ "vscode", "edit", "reveal" ] },
    { mime = "application/{json,ndjson}", use = [ "vscode", "edit", "reveal" ] },
    { mime = "*/javascript", use = [ "vscode", "edit", "reveal" ] },
    { mime = "inode/empty", use = [ "vscode", "edit", "reveal" ] },
]