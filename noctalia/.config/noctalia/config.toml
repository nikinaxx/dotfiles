config_version = 14

[bar]
order = [ "primary" ]

    [bar.primary]
    background_opacity = 0.65999998524785042
    border_width = 1.0
    center = [ "workspaces" ]
    concave_edge_corners = false
    end = [ "tray", "notifications", "clipboard", "network", "bluetooth", "volume", "brightness", "battery", "clock" ]
    margin_edge = 3
    margin_ends = 16
    position = "bottom"
    radius = 8
    start = [ "session", "control-center", "launcher", "wallhaven" ]
    thickness = 27

        [bar.primary.monitor."Dell Inc. DELL S2721DS 5LWPQ43"]

        [bar.primary.monitor."Dell Inc. DELL S2722DC 6NSGHD3"]
        end = []
        start = []

