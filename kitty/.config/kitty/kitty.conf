# Configuration
font_family                 FiraCode Nerd Font
font_size                   12
modify_font 		        baseline 2px
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
scrollback_pager nvim --noplugin -c "set signcolumn=no showtabline=0 laststatus=0" -c "silent write! /tmp/kitty_scrollback_buffer | te cat /tmp/kitty_scrollback_buffer - "
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          1.0
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

# Vim-style scrolling (half page via remote_control, which works without allow_remote_control)
map ctrl+shift+e scroll_line_down
map ctrl+shift+y scroll_line_up
map ctrl+shift+d remote_control scroll-window 0.5p
map ctrl+shift+u remote_control scroll-window 0.5p-

# Animated cursor follows text
include $HOME/.config/ml4w/settings/kitty-cursor-trail.conf

# Include wallpaper colors
# include colors-matugen.conf
include custom-colors.conf

# Include Custom Configuration
# Create the file custom.conf in ~/.config/kitty to overwrite the default configuration
#include $HOME/.config/kitty/custom.conf

